name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: build + test (macOS)
    runs-on: macos-26
    env:
      XCODE_PATH: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test --parallel

      - name: Check ownership at compile time
        run: python3 Scripts/check-api.py

  linux:
    name: build + test (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        swift: ["6.2", "latest"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler-check dependency
        run: apt-get update && apt-get install -y --no-install-recommends python3

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test --parallel

      - name: Check ownership at compile time
        run: python3 Scripts/check-api.py

  lint:
    name: swift-format lint
    runs-on: macos-26
    env:
      XCODE_PATH: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"

      - name: Lint
        run: swift format lint --recursive --strict Sources Tests Package.swift
